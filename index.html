const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d)));
  try{sessionStorage.setItem('rg-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const btn=document.getElementById('b'),e=document.getElementById('e');
  btn.disabled=true;btn.textContent='Opening…';e.textContent='';
  try{await open(document.getElementById('pw').value)}catch(x){e.textContent='Wrong password.';btn.disabled=false;btn.textContent='Open'}
});
let saved=null;try{saved=sessionStorage.getItem('rg-pw')}catch(e){}
if(saved)open(saved).catch(()=>{try{sessionStorage.removeItem('rg-pw')}catch(e){}});
</script>
